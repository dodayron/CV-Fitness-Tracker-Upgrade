<!DOCTYPE html>
<html>
<head>
    <title>PoseRec Sessions</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px; border: 1px solid #ccc; text-align: center; }
        th { background-color: #333; color: white; }
    </style>
</head>
<body>

<p style="margin:8px 0 16px; font-family:sans-serif; font-size:13px;">
  <a href="/">← New Layout</a> &nbsp;|&nbsp; <a href="/analytics">Analytics</a>
</p>

<h2>Exercise History</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Exercise</th>
        <th>Reps</th>
        <th>Sets</th>
        <th>Date</th>
        <th>Start</th>
        <th>End</th>
    </tr>

    {% for s in sessions %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
        <td>{{ s[4] }}</td>
        <td>{{ s[5] }}</td>
        <td>{{ s[6] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
